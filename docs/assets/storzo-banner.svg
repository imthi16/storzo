<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">Storzo — Your images. Your infrastructure.</title>
  <desc id="description">Dark infrastructure-themed banner with yellow accents and an abstract storage rack. Self-hosted image storage console, powered by SeaweedFS.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#0b0f13"/>
      <stop offset="1" stop-color="#171f27"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#303d4a" stroke-opacity=".3"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="16" fill="url(#background)"/>
  <rect width="1280" height="360" rx="16" fill="url(#grid)"/>
  <path d="M0 64V16Q0 0 16 0H208" fill="none" stroke="#e8c547" stroke-width="4"/>
