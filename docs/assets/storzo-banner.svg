    <rect x="64" y="53" width="236" height="28" rx="4" fill="#e8c547"/>
    <text x="80" y="72" font-size="12" font-weight="700" letter-spacing="2" fill="#17130a">SELF-HOSTED STORAGE</text>
    <text x="66" y="314" font-size="12" letter-spacing="1.4" fill="#9aa8b5">REACT / FASTAPI / SEAWEEDFS</text>
  </g>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="60" y="171" font-size="82" font-weight="700" letter-spacing="-4" fill="#dde5ec">Storzo<tspan fill="#e8c547">.</tspan></text>
    <text x="65" y="225" font-size="28" font-weight="500" fill="#dde5ec">Your images. Your infrastructure.</text>
    <text x="66" y="260" font-size="17" fill="#9aa8b5">An image storage console over SeaweedFS S3.</text>
  </g>
  <g transform="translate(915 54)">
    <rect width="274" height="252" rx="12" fill="#0b0f13" stroke="#303d4a"/>
    <g fill="#171f27" stroke="#303d4a">
