apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "storzo.fullname" . }}-audit
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.backend.auditStorage.storageClassName }}
  storageClassName: {{ .Values.backend.auditStorage.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backend.auditStorage.size }}
